name: Metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: y4motion
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          config_padding: 0, 8 + 11%

          # Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # 3D Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit

          # Topics tag cloud
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
          plugin_topics_sort: stars

          # Recently edited code snippets
          plugin_code: yes
          plugin_code_days: 3
          plugin_code_lines: 12
          plugin_code_load: 100
          plugin_code_visibility: public

          # Lines of code
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # Custom CSS — teal/purple palette via SVG attribute selectors
          extras_css: |
            h2, h3 { color: #2dd4bf !important; }
            /* Override GitHub green calendar palette → teal gradient */
            rect[fill="#9be9a8"], path[fill="#9be9a8"] { fill: #99f6e4 !important; }
            rect[fill="#40c463"], path[fill="#40c463"] { fill: #5eead4 !important; }
            rect[fill="#30a14e"], path[fill="#30a14e"] { fill: #2dd4bf !important; }
            rect[fill="#216e39"], path[fill="#216e39"] { fill: #0d9488 !important; }
            /* Empty cells — subtle dark */
            rect[fill="#ebedf0"], path[fill="#ebedf0"] { fill: #1e293b !important; }
            /* Octicons — purple accent */
            section > .field > svg.octicon { color: #8b5cf6 !important; }
