name: Metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: y4motion
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          config_padding: 0, 8 + 11%

          # Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # 3D Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit

          # Topics tag cloud
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
          plugin_topics_sort: stars

          # Recently edited code snippets
          plugin_code: yes
          plugin_code_days: 3
          plugin_code_lines: 12
          plugin_code_load: 100
          plugin_code_visibility: public

          # Lines of code
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # Custom CSS — teal/purple palette for isocalendar + headers
          extras_css: |
            h2, h3 { color: #2dd4bf !important; }
            .isocalendar svg:not(.isocalendar-graph) { color: #2dd4bf !important; }
            .isocalendar-day-level-1 { fill: #5eead4 !important; }
            .isocalendar-day-level-2 { fill: #2dd4bf !important; }
            .isocalendar-day-level-3 { fill: #14b8a6 !important; }
            .isocalendar-day-level-4 { fill: #0d9488 !important; }
            :root {
              --color-calendar-graph-day-L1-bg: #5eead4;
              --color-calendar-graph-day-L2-bg: #2dd4bf;
              --color-calendar-graph-day-L3-bg: #14b8a6;
              --color-calendar-graph-day-L4-bg: #0d9488;
            }
            section > .field > svg.octicon { color: #8b5cf6 !important; }
